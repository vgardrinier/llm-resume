<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rightfit - OG Image Preview</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
        }
        .og-card {
            width: 1200px;
            height: 630px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 80px;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
        }
        .og-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
        }
        .logo {
            font-size: 48px;
            font-weight: 700;
            color: white;
            margin-bottom: 30px;
            letter-spacing: -1px;
            position: relative;
            z-index: 1;
        }
        .tagline {
            font-size: 56px;
            font-weight: 700;
            color: white;
            text-align: center;
            line-height: 1.2;
            margin-bottom: 30px;
            position: relative;
            z-index: 1;
        }
        .subtitle {
            font-size: 32px;
            color: rgba(255,255,255,0.9);
            text-align: center;
            font-weight: 400;
            position: relative;
            z-index: 1;
        }
        .badge {
            position: absolute;
            bottom: 40px;
            right: 40px;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 18px;
            color: white;
            font-weight: 600;
            border: 2px solid rgba(255,255,255,0.3);
        }
    </style>
</head>
<body>
    <div class="og-card">
        <div class="logo">Rightfit</div>
        <div class="tagline">Transform Your Resume<br/>Get the Job</div>
        <div class="subtitle">Fast Analysis • Deep Insights • Honest Feedback</div>
        <div class="badge">Free Tool</div>
    </div>

        console.log('📸 Screenshot this at 1200x630px and save as og-image.png');
    </script>
</body>
</html>
